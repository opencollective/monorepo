name: Compile Agentic Workflows

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test workflow helpers
        run: node --test .github/workflows/scripts/*.test.mjs

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@bde367913adeb3132f0a171594c88a17f4b7d08c # v0.88.7
        with:
          version: v0.88.7
          github-token: ${{ github.token }}

      - name: Compile workflows
        run: gh aw compile

      - name: Check for uncommitted compiled workflows
        run: git diff --exit-code -- .github/workflows
