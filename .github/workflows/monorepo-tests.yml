name: Monorepo Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # These checks use temporary Git/SSH fixtures; no KVM host, VM boot, private
  # repository access, or model-provider credentials are needed in CI.
  init-tests:
    name: Monorepo initialization tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install toolchain test dependency
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run monorepo and VM tests
        run: node --test scripts/init.test.mjs scripts/vm.test.mjs .vm/*.test.mjs

  # Shell validation complements Node behavior tests. Live provisioning and
  # editor acceptance remain manual checks on a Linux host with KVM/libvirt.
  vm-checks:
    name: Development VM static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell scripts
        run: shellcheck -S warning .vm/*.sh scripts/vm.sh scripts/start-dependencies.sh .devcontainer/shell-aliases.sh
